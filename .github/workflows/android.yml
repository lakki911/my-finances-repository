# Builds a signed Android APK from the web app on every push to main,
# and publishes it as a GitHub release (download: Releases → my-finances.apk).
name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so the newest build is always the latest release.
concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install

      - name: Copy web app into www
        run: |
          rm -rf www && mkdir www
          cp -r ../index.html ../styles.css ../*.js ../manifest.webmanifest ../icons ../fonts www/
          rm -f www/sw.js
          # Capacitor's JS runtime (registerPlugin etc.) must load before the app.
          cp node_modules/@capacitor/core/dist/capacitor.js www/
          sed -i 's|<script type="module" src="app.js"></script>|<script src="capacitor.js"></script>\n  <script type="module" src="app.js"></script>|' www/index.html
          grep -q 'src="capacitor.js"' www/index.html

      - run: npx cap add android

      # Google sign-in with Drive access needs MainActivity to hand results to the plugin.
      - name: Use custom MainActivity
        run: cp MainActivity.java android/app/src/main/java/com/lakki911/myfinances/MainActivity.java
      - run: npx capacitor-assets generate --android

      - name: Set app version from run number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - run: npx cap sync android

      - name: Build release APK
        working-directory: android-app/android
        run: ./gradlew assembleRelease --console=plain

      # Sign explicitly with apksigner (v1+v2+v3) and verify, so Android accepts the file.
      - name: Sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias myfinances \
            --ks-pass pass:myfinances-apk --key-pass pass:myfinances-apk \
            --out "$GITHUB_WORKSPACE/my-finances.apk" aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/my-finances.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: my-finances-apk
          path: my-finances.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: My Finances 1.${{ github.run_number }}
          body: Install my-finances.apk on your Android phone.
          files: my-finances.apk
          make_latest: true
